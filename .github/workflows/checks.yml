name: Checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-api.txt pytest httpx
      - run: python -m compileall -q carbids app.py
      - run: pytest -q tests
